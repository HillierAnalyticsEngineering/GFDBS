  parameterizer:
    tier: balanced
  systems_engineer:
    tier: deep
    instructions: agents/systems_engineer.md
    memory: true
  specialists:
  - capability: scheduling
    instructions: agents/scheduling.md
    tier: balanced
    tools: []
  - capability: storage
    instructions: agents/storage.md
    tier: balanced
    tools: []
  - capability: availability
