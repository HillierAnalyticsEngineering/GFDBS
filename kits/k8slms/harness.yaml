name: Kubernetes LMS platform design system
building: LMS cluster deployment
id_prefix: k8slms
description: Assesses a Kubernetes-based learning management system deployment. It covers the LMS app with a payment
  sidecar, Judge0 code execution, a learning record store, RDBMS, content cache and blob storage, SAML federation
  with optional Keycloak, PKI between nodes, and cost management. The checks are workload placement and capacity,
  persistent storage, high availability and fault tolerance, identity and PKI security, code-execution isolation,
  and cost.
